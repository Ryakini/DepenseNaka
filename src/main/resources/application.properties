spring.application.name=DepenseNaka

# Chemin vers la base de donnees
#spring.datasource.url=jdbc:sqlite:depensenaka.db
# Utilisation d'un chemin relatif au dossier de l'utilisateur Windows (${user.home}) en production et on commente en developpement
#pring.datasource.url=jdbc:sqlite:${user.home}/DepenseNaka/Data/depensenaka.db
#spring.datasource.url=jdbc:sqlite:seravarotra.db?journal_mode=WAL&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-timeout=5000

# Active le batching global pour la résolution des collections paresseuses (Lazy), cgargement par liste de 25 lignes
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# Limiter a 1 seule connexion d'ecriture active a la fois pour SQLite
spring.datasource.hikari.maximum-pool-size=1

# Dialecte Hibernate pour SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
